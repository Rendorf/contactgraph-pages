name: Rotate OpenAlex API secret

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Add a new version, or disable exposed version 1 after deployment verification
        required: true
        default: add-version
        type: choice
        options:
          - add-version
          - disable-version-1

permissions:
  id-token: write

env:
  PROJECT_ID: contactgraph-vusal-2026
  SECRET_ID: openalex-api-key

concurrency:
  group: contactgraph-openalex-secret-rotation
  cancel-in-progress: false

jobs:
  rotate:
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SECRET_ROTATION_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    environment: production-osint
    steps:
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SECRET_ROTATION_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Add and verify OpenAlex secret version
        if: inputs.operation == 'add-version'
        shell: bash
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          set -euo pipefail
          if (( ${#OPENALEX_API_KEY} < 16 || ${#OPENALEX_API_KEY} > 256 )); then
            echo "OPENALEX_API_KEY has an invalid length" >&2
            exit 1
          fi
          if [[ "$OPENALEX_API_KEY" =~ [[:space:][:cntrl:]] ]]; then
            echo "OPENALEX_API_KEY contains whitespace or control characters" >&2
            exit 1
          fi

          VERSION_NAME="$(
            printf '%s' "$OPENALEX_API_KEY" \
              | gcloud secrets versions add "$SECRET_ID" \
                  --project "$PROJECT_ID" \
                  --data-file=- \
                  --format='value(name)'
          )"
          VERSION_NUMBER="${VERSION_NAME##*/}"
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Secret Manager did not return a version number" >&2
            exit 1
          fi

          EXPECTED_HASH="$(printf '%s' "$OPENALEX_API_KEY" | sha256sum | cut -d ' ' -f1)"
          ACTUAL_HASH="$(gcloud secrets versions access "$VERSION_NUMBER" --secret "$SECRET_ID" --project "$PROJECT_ID" | sha256sum | cut -d ' ' -f1)"
          test "$EXPECTED_HASH" = "$ACTUAL_HASH"

          echo "OpenAlex secret version $VERSION_NUMBER was added and verified without exposing its value."
      - name: Disable exposed OpenAlex secret version 1
        if: inputs.operation == 'disable-version-1'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(gcloud secrets versions describe 1 --secret "$SECRET_ID" --project "$PROJECT_ID" --format='value(state)')" == "ENABLED" ]]; then
            gcloud secrets versions disable 1 \
              --secret "$SECRET_ID" \
              --project "$PROJECT_ID" \
              --quiet
          fi
          test "$(gcloud secrets versions describe 1 --secret "$SECRET_ID" --project "$PROJECT_ID" --format='value(state)')" = "DISABLED"
          echo "Exposed OpenAlex secret version 1 is disabled."
